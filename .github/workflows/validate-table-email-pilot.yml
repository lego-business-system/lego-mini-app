name: Validate table email release

on:
  pull_request:
    paths:
      - "index.html"
      - "table-email.js"
      - "table-email.css"
      - "supabase/functions/send-table-email/**"
      - "supabase/migrations/20260726_table_email_pilot.sql"
      - "supabase/config.toml"
      - ".github/workflows/validate-table-email-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout proposed release
        uses: actions/checkout@v4

      - name: Validate browser JavaScript syntax
        run: node --check table-email.js

      - name: Validate Edge Function TypeScript syntax
        run: |
          npx --yes esbuild@0.25.8 \
            supabase/functions/send-table-email/index.ts \
            --bundle \
            --platform=neutral \
            --format=esm \
            --external:npm:* \
            --external:jsr:* \
            --outfile=/tmp/send-table-email.mjs

      - name: Validate public wiring and security boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path("index.html").read_text(encoding="utf-8")
          frontend = Path("table-email.js").read_text(encoding="utf-8")
          css = Path("table-email.css").read_text(encoding="utf-8")
          function = Path("supabase/functions/send-table-email/index.ts").read_text(encoding="utf-8")
          migration = Path("supabase/migrations/20260726_table_email_pilot.sql").read_text(encoding="utf-8")
          config = Path("supabase/config.toml").read_text(encoding="utf-8")

          required_index_entries = (
              'table-email.css?v=v141-table-email-public-20260726',
              'table-email.js?v=v140-table-email-pilot-20260726',
          )
          for entry in required_index_entries:
              assert entry in index, f"index.html is missing {entry}"

          assert index.index('finance-thinking-v138.js') < index.index('table-email.js'), \
              "table-email.js must load after lesson modules"
          assert 'table-email-pilot-gate.js' not in index
          assert not Path('table-email-pilot-gate.js').exists()

          assert 'Telegram.WebApp' in frontend
          assert 'initData' in frontend
          assert 'docs.google.com' in frontend
          assert 'RESEND_API_KEY' not in frontend
          assert 'TELEGRAM_BOT_TOKEN' not in frontend
          assert 'SUPABASE_SERVICE_ROLE_KEY' not in frontend
          assert 'SUPABASE_SECRET_KEYS' not in frontend

          assert '.table-email-btn-v140' in css
          assert 'display: none' not in css
          assert 'table-email-pilot-enabled-v140' not in css

          for marker in (
              'withSupabase({ auth: "none" }',
              'ctx.supabaseAdmin',
              'validateTelegramInitData',
              'https://api.resend.com/emails',
              'RESEND_API_KEY',
              'EMAIL_FROM',
              'docs.google.com',
              'RATE_LIMIT_MINUTE',
              'RATE_LIMIT_DAY',
          ):
              assert marker in function, f"Edge Function is missing {marker}"

          assert 'ADMIN_TELEGRAM_ID' not in function
          assert 'PILOT_NOT_AVAILABLE' not in function

          assert 'app_table_email_profiles' in migration
          assert 'app_table_email_sends' in migration
          assert 'enable row level security' in migration.lower()
          assert 'revoke all' in migration.lower()
          assert '[functions.send-table-email]' in config
          assert 'verify_jwt = false' in config

          forbidden_fragments = (
              're_',
              'sb_secret_',
              'service_role ey',
          )
          combined = frontend + "\n" + function + "\n" + migration
          for fragment in forbidden_fragments:
              assert fragment not in combined, f"Possible committed secret marker: {fragment}"

          print("Public email release static validation passed")
          PY
