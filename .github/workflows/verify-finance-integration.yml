name: Verify Finance integration

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: verify-finance-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
          check-latest: false
          package-manager-cache: false

      - name: Install pinned ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep=14.1.0-1
          test "$(rg --version | head -n 1)" = "ripgrep 14.1.0"

      - name: Run Finance integration verification
        run: ./supabase/tests/verify_local.sh
