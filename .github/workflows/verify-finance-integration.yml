name: Verify Finance integration

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: verify-finance-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.10-bookworm@sha256:17b6c778de50f4bb9a878c36e736110fbcd9b7020377d6fdfdf20f7c0347e40a
        env:
          POSTGRES_DB: main_finance_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: main-finance-ci-ephemeral-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d main_finance_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.14.0
          check-latest: false
          package-manager-cache: false

      - name: Use Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.2

      - name: Install pinned ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep=14.1.0-1
          test "$(rg --version | head -n 1)" = "ripgrep 14.1.0"

      - name: Enforce reviewed Finance v2 pilot scope
        run: |
          test -f finance-pilot/index.template.html
          test -f scripts/build-finance-pilot.mjs
          test -f scripts/verify-finance-pilot-hosted.mjs
          test -f scripts/main-finance-runtime-recovery-v2-snapshot.mjs
          test -f scripts/manage-finance-access-v2.mjs
          test -f scripts/prepare-main-finance-runtime-recovery-v2.mjs
          test -f supabase/functions/finance-sync-entitlements/index.ts
          test -f supabase/functions/_shared/main-entitlement-protocol-v2.mjs
          test -f supabase/functions/finance-manage-access-v2/deno.json
          test -f supabase/functions/finance-manage-access-v2/deno.lock
          test -f supabase/functions/finance-manage-access-v2/index.ts
          test -f supabase/releases/main-finance-runtime-recovery-v2/README.md
          test -f supabase/releases/main-finance-runtime-recovery-v2/environment.contract.json
          test -f supabase/releases/main-finance-runtime-recovery-v2/postflight.contract.json
          test -f supabase/releases/main-finance-runtime-recovery-v2/preflight.sql
          test -f supabase/releases/main-finance-runtime-recovery-v2/staging.manifest.json
          test -f supabase/tests/main_finance_runtime_recovery_release_v2.test.mjs
          test -f supabase/tests/main_finance_runtime_secret_recovery_v2.test.mjs
          test -f supabase/tests/manage_finance_access_v2.test.mjs
          test ! -e supabase/migrations/20260715030000_finance_subject_rotation_v2.sql
          test ! -e supabase/functions/finance-sync-entitlements-v2
          test ! -e scripts/manage-finance-subject-rotation-v2.mjs

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/agent/main-finance-staging-runtime-recovery-v2" ]]; then
            base_commit="adcf7b919d34e512ded6d526ee7321f795f8f887"
            base_tree="f02055d03d63a1fc2ebdbb17aeed3bcb2aafd22a"
            test "${GITHUB_SHA}" = "$(GIT_NO_REPLACE_OBJECTS=1 git rev-parse HEAD)"
            test "$(GIT_NO_REPLACE_OBJECTS=1 git cat-file -t "${base_commit}")" = "commit"
            base_commit_object="$(GIT_NO_REPLACE_OBJECTS=1 git cat-file -p "${base_commit}")"
            IFS= read -r base_tree_header <<< "${base_commit_object}"
            test "${base_tree_header}" = "tree ${base_tree}"
            commit_object="$(GIT_NO_REPLACE_OBJECTS=1 git cat-file -p "${GITHUB_SHA}")"
            commit_headers=()
            header_separator_seen=0
            while IFS= read -r line; do
              if [[ -z "${line}" ]]; then
                header_separator_seen=1
                break
              fi
              commit_headers+=("${line}")
            done <<< "${commit_object}"
            test "${header_separator_seen}" = "1"
            test "${#commit_headers[@]}" = "4"
            [[ "${commit_headers[0]}" =~ ^tree\ ([0-9a-f]{40})$ ]]
            head_tree="${BASH_REMATCH[1]}"
            test "${commit_headers[1]}" = "parent ${base_commit}"
            [[ "${commit_headers[2]}" =~ ^author\ .+$ ]]
            [[ "${commit_headers[3]}" =~ ^committer\ .+$ ]]
            test "$(GIT_NO_REPLACE_OBJECTS=1 git cat-file -t "${base_tree}")" = "tree"
            test "$(GIT_NO_REPLACE_OBJECTS=1 git cat-file -t "${head_tree}")" = "tree"
            expected_changes="$(printf '%b\n' \
              'A\tscripts/main-finance-runtime-recovery-v2-snapshot.mjs' \
              'A\tscripts/manage-finance-access-v2.mjs' \
              'A\tscripts/prepare-main-finance-runtime-recovery-v2.mjs' \
              'A\tsupabase/functions/finance-manage-access-v2/deno.json' \
              'A\tsupabase/functions/finance-manage-access-v2/deno.lock' \
              'A\tsupabase/functions/finance-manage-access-v2/index.ts' \
              'A\tsupabase/releases/main-finance-runtime-recovery-v2/README.md' \
              'A\tsupabase/releases/main-finance-runtime-recovery-v2/environment.contract.json' \
              'A\tsupabase/releases/main-finance-runtime-recovery-v2/postflight.contract.json' \
              'A\tsupabase/releases/main-finance-runtime-recovery-v2/preflight.sql' \
              'A\tsupabase/releases/main-finance-runtime-recovery-v2/staging.manifest.json' \
              'A\tsupabase/tests/main_finance_runtime_recovery_release_v2.test.mjs' \
              'A\tsupabase/tests/main_finance_runtime_secret_recovery_v2.test.mjs' \
              'A\tsupabase/tests/manage_finance_access_v2.test.mjs' \
              'M\t.github/workflows/verify-finance-integration.yml' \
              'M\tsupabase/tests/finance_integration_ci.test.mjs' \
              'M\tsupabase/tests/postgres-ci/static_guard.test.mjs' \
              'M\tsupabase/tests/verify_local.sh' | LC_ALL=C sort)"
            actual_changes="$(GIT_NO_REPLACE_OBJECTS=1 git diff-tree --no-renames --no-commit-id --name-status -r "${base_tree}" "${head_tree}" | LC_ALL=C sort)"
            test "${actual_changes}" = "${expected_changes}"
          fi

      - name: Run Finance pilot verification
        run: ./supabase/tests/verify_local.sh

      - name: Validate disposable PostgreSQL harness
        run: node --test supabase/tests/postgres-ci/static_guard.test.mjs

      - name: Verify frozen Edge dependency graph
        run: |
          deno check --config supabase/functions/finance-issue-code/deno.json --frozen supabase/functions/finance-issue-code/index.ts
          (cd supabase/functions/finance-issue-code && deno audit --frozen)
          deno check --config supabase/functions/finance-sync-entitlements/deno.json --frozen supabase/functions/finance-sync-entitlements/index.ts
          (cd supabase/functions/finance-sync-entitlements && deno audit --frozen)
          deno check --config supabase/functions/finance-manage-access-v2/deno.json --frozen supabase/functions/finance-manage-access-v2/index.ts
          (cd supabase/functions/finance-manage-access-v2 && deno audit --frozen)

      - name: Execute main Finance foundation on disposable PostgreSQL 17
        env:
          CI: "true"
          MAIN_FINANCE_CI_ALLOW_EPHEMERAL: "1"
          PGHOST: 127.0.0.1
          PGPORT: ${{ job.services.postgres.ports[5432] }}
          PGDATABASE: main_finance_ci
          PGUSER: postgres
          PGPASSWORD: main-finance-ci-ephemeral-only
          PGSSLMODE: disable
          PGCONNECT_TIMEOUT: "5"
        run: ./supabase/tests/postgres-ci/run.sh
