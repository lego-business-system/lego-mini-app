name: Diagnose business system payload v136

on:
  push:
    branches:
      - feature/business-system-complete-v136
    paths:
      - tools/diagnose-business-system-payload-v136.py

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/business-system-complete-v136
          fetch-depth: 0
      - run: python tools/diagnose-business-system-payload-v136.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/payload-diagnostic-v136.txt
          git commit -m "Report v136 payload diagnostics" || exit 0
          git push origin HEAD:feature/business-system-complete-v136
