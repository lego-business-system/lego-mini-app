name: Validate finance v138 bundle

on:
  push:
    branches:
      - feature/finance-thinking-sections-2-11-v138
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finance-v138-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          show-progress: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            finance-thinking-v138.js
            content/finance_thinking_v138
      - name: Repair one extra character in part-08
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, json

          files = [
              "content/finance_thinking_v138/bundle/part-00.txt",
              "content/finance_thinking_v138/bundle/part-01.txt",
              "content/finance_thinking_v138/bundle/part-02.txt",
              "content/finance_thinking_v138/bundle/part-03.txt",
              "content/finance_thinking_v138/bundle/part-04.txt",
              "content/finance_thinking_v138/bundle/part-05a.txt",
              "content/finance_thinking_v138/bundle/part-05b.txt",
              "content/finance_thinking_v138/bundle/part-06.txt",
              "content/finance_thinking_v138/bundle/part-07.txt",
              "content/finance_thinking_v138/bundle/part-08.txt",
              "content/finance_thinking_v138/bundle/part-09.txt",
              "content/finance_thinking_v138/bundle/part-10.txt",
              "content/finance_thinking_v138/bundle/part-11.txt",
              "content/finance_thinking_v138/bundle/part-12a.txt",
              "content/finance_thinking_v138/bundle/part-12b.txt",
              "content/finance_thinking_v138/bundle/part-13.txt",
          ]
          target = "content/finance_thinking_v138/bundle/part-08.txt"
          texts = {path: Path(path).read_text(encoding="utf-8").strip() for path in files}

          def payload_for(candidate):
              texts[target] = candidate
              encoded = "".join(texts[path] for path in files)
              try:
                  decoded = gzip.decompress(base64.b64decode(encoded, validate=True))
                  payload = json.loads(decoded)
                  data = payload.get("data") or {}
                  sections = data.get("sections") or {}
                  section_values = list(sections.values()) if isinstance(sections, dict) else list(sections)
                  lessons = [lesson for section in section_values for lesson in (section.get("lessons") or [])]
                  ids = sorted(int(lesson.get("id")) for lesson in lessons)
                  screens = sum(len(lesson.get("screens") or lesson.get("slides") or []) for lesson in lessons)
                  questions = sum(len((section.get("quiz") or {}).get("questions") or []) for section in section_values)
                  if len(section_values) != 10 or len(lessons) != 58 or ids != list(range(5, 63)):
                      return None
                  if screens < 1000 or questions < 100:
                      return None
                  if not isinstance(payload.get("runtime"), str) or not isinstance(payload.get("css"), str):
                      return None
                  return payload
              except Exception:
                  return None

          source = texts[target]
          if len(source) == 10000:
              assert payload_for(source) is not None, "part-08 has expected length but bundle is still invalid"
              print("part-08 already repaired")
          else:
              assert len(source) == 10001, f"Expected part-08 length 10001 before repair, got {len(source)}"
              matches = []
              for index in range(len(source)):
                  candidate = source[:index] + source[index + 1:]
                  if payload_for(candidate) is not None:
                      matches.append((index, source[index], candidate))
                      if len(matches) > 1:
                          break
              assert len(matches) == 1, f"Expected one valid deletion, found {[(i, ch) for i, ch, _ in matches]}"
              index, removed, repaired = matches[0]
              Path(target).write_text(repaired, encoding="utf-8")
              print(f"Repaired part-08: removed {removed!r} at index {index}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/finance_thinking_v138/bundle/part-08.txt
          if ! git diff --cached --quiet; then
            git commit -m "Repair finance v138 bundle part-08"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Decode and validate bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, json, hashlib

          files = [
              "content/finance_thinking_v138/bundle/part-00.txt",
              "content/finance_thinking_v138/bundle/part-01.txt",
              "content/finance_thinking_v138/bundle/part-02.txt",
              "content/finance_thinking_v138/bundle/part-03.txt",
              "content/finance_thinking_v138/bundle/part-04.txt",
              "content/finance_thinking_v138/bundle/part-05a.txt",
              "content/finance_thinking_v138/bundle/part-05b.txt",
              "content/finance_thinking_v138/bundle/part-06.txt",
              "content/finance_thinking_v138/bundle/part-07.txt",
              "content/finance_thinking_v138/bundle/part-08.txt",
              "content/finance_thinking_v138/bundle/part-09.txt",
              "content/finance_thinking_v138/bundle/part-10.txt",
              "content/finance_thinking_v138/bundle/part-11.txt",
              "content/finance_thinking_v138/bundle/part-12a.txt",
              "content/finance_thinking_v138/bundle/part-12b.txt",
              "content/finance_thinking_v138/bundle/part-13.txt",
          ]
          encoded = "".join(Path(path).read_text(encoding="utf-8").strip() for path in files)
          compressed = base64.b64decode(encoded, validate=True)
          decoded = gzip.decompress(compressed)
          payload = json.loads(decoded)
          assert isinstance(payload.get("runtime"), str) and len(payload["runtime"]) > 1000
          assert isinstance(payload.get("css"), str) and len(payload["css"]) > 1000
          data = payload.get("data")
          assert isinstance(data, dict), "payload.data must be an object"
          sections = data.get("sections")
          section_values = list(sections.values()) if isinstance(sections, dict) else list(sections or [])
          lessons = [lesson for section in section_values for lesson in (section.get("lessons") or [])]
          ids = sorted(int(item.get("id")) for item in lessons)
          screen_count = sum(len(item.get("screens") or item.get("slides") or []) for item in lessons)
          question_count = sum(len((section.get("quiz") or {}).get("questions") or []) for section in section_values)
          assert len(section_values) == 10
          assert len(lessons) == 58
          assert ids == list(range(5, 63))
          assert screen_count >= 1000
          assert question_count >= 100
          assert ((data.get("catalog") or {}).get("section1") or {}).get("status") == "frozen-existing"
          Path("/tmp/finance-v138-runtime.js").write_text(payload["runtime"], encoding="utf-8")
          report = {
              "status": "bundle_valid",
              "sections": len(section_values),
              "lessons": len(lessons),
              "screens": screen_count,
              "questions": question_count,
              "encoded_chars": len(encoded),
              "compressed_bytes": len(compressed),
              "compressed_sha256": hashlib.sha256(compressed).hexdigest(),
              "decoded_bytes": len(decoded),
              "decoded_sha256": hashlib.sha256(decoded).hexdigest(),
              "runtime_bytes": len(payload["runtime"].encode()),
              "css_bytes": len(payload["css"].encode()),
          }
          Path("/tmp/finance-v138-report.json").write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Check JavaScript syntax
        run: |
          node --check /tmp/finance-v138-runtime.js
          node --check finance-thinking-v138.js
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-v138-validation-report
          path: /tmp/finance-v138-report.json
          if-no-files-found: error
